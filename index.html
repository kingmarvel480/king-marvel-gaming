<!DOCTYPE html>
<html>
<head>
    <title>King Marvel Gaming</title>

    <style>
        body {
            background-color: #111;
            color: white;
            text-align: center;
            font-family: Arial;
            margin: 0;
        }

        nav {
            background-color: black;
            padding: 20px;
        }

        nav a {
            color: white;
            margin: 20px;
            text-decoration: none;
            font-size: 18px;
        }

        nav a:hover {
            color: yellow;
        }

        .hero {
            padding: 40px 20px;
            background: linear-gradient(135deg, #222, #444);
        }

        .banner {
            width: 90%;
            max-width: 800px;
            height: 300px;
            object-fit: cover;
            border-radius: 15px;
            margin: 20px auto;
            display: block;
        }

        h1 {
            font-size: 50px;
            margin: 10px;
        }

        .hero p {
            font-size: 22px;
        }

        .play-button {
            display: inline-block;
            background-color: yellow;
            color: black;
            padding: 15px 35px;
            font-size: 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 20px;
            text-decoration: none;
        }

        .play-button:hover {
            background-color: orange;
        }

        .gaming-box {
            margin: 40px auto;
            padding: 30px;
            max-width: 600px;
            background-color: #222;
            border-radius: 15px;
        }

        h2 {
            font-size: 30px;
            color: yellow;
            margin-top: 50px;
        }

        p {
            font-size: 20px;
        }

        .message-button {
            padding: 12px 25px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
        }

        .message-button:hover {
            background-color: yellow;
        }

        footer {
            background-color: black;
            padding: 20px;
            margin-top: 60px;
        }
    </style>
</head>

<body>

    <nav>
        <a href="index.html">Home</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
    </nav>

    <section class="hero">

        <h1>🔥 KING MARVEL GAMING 🔥</h1>

        <p>Welcome to my gaming world!</p>

        <img
            class="banner"
            src="https://placehold.co/800x300/222222/FFFF00?text=KING+MARVEL+GAMING"
            alt="King Marvel Gaming Banner"
        >

        <a href="game.html" class="play-button">
            🎮 PLAY NOW
        </a>

    </section>

    <div class="gaming-box">

        <p id="message">
            I am learning web development and building my gaming website!
        </p>

        <button class="message-button" onclick="changeMessage()">
            Click Me
        </button>

    </div>

    <h2 id="about">About Me</h2>

    <p>
        I am learning coding and building my own gaming website.
    </p>

    <h2 id="contact">Contact</h2>

    <p>
        Thanks for visiting King Marvel Gaming!
    </p>

    <footer>
        <p>🔥 King Marvel Gaming 🔥</p>
    </footer>

    <script>

        function changeMessage() {
            document.getElementById("message").innerHTML =
                "🎮 You just used JavaScript! 🔥";
        }

    </script>

</body>
</html>
